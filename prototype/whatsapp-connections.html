<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp · Protótipo</title>
  <style>
    :root { --ink:#15231d; --muted:#68776f; --line:#dce6df; --paper:#f6f8f5; --white:#fff; --green:#087443; --green-soft:#e3f4e8; --amber:#9a6200; --amber-soft:#fff1d5; --red:#aa3a36; --red-soft:#fce6e4; --blue:#2e5c9a; --blue-soft:#e7effc; --shadow:0 22px 65px rgba(23,55,39,.10); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--paper); font-synthesis:none; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:var(--paper); }
    button,input { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,input:focus-visible { outline:3px solid rgba(8,116,67,.27); outline-offset:2px; }
    .prototype-ribbon { position:sticky; z-index:30; top:0; display:flex; justify-content:center; gap:10px; padding:7px 16px; color:#dff7e9; background:#17342a; font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
    .prototype-ribbon strong { color:#fff; }
    .topbar { position:relative; display:flex; align-items:center; justify-content:space-between; gap:22px; height:76px; padding:0 clamp(20px,5vw,72px); border-bottom:1px solid var(--line); background:rgba(255,255,255,.92); }
    .brand { display:flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none; font-size:14px; font-weight:850; letter-spacing:-.03em; }
    .brand-mark { display:grid; place-items:center; width:33px; height:33px; border-radius:10px; color:#fff; background:var(--green); font-size:18px; }
    .topbar-center { position:absolute; left:50%; transform:translateX(-50%); }
    .number-trigger { display:flex; align-items:center; gap:10px; min-width:220px; padding:7px 10px; border:1px solid transparent; border-radius:12px; color:var(--ink); background:transparent; text-align:left; }
    .number-trigger:hover,.number-trigger[aria-expanded="true"] { border-color:var(--line); background:#f7faf7; }
    .number-avatar { display:grid; place-items:center; flex:0 0 auto; width:32px; height:32px; border-radius:10px; color:var(--green); background:var(--green-soft); font-size:11px; font-weight:850; }
    .profile-photo { position:relative; display:block; flex:0 0 auto; overflow:hidden; border:2px solid rgba(255,255,255,.8); border-radius:22px; background:linear-gradient(145deg,#b7d9c2 0%,#5e9b77 45%,#214737 100%); box-shadow:0 6px 15px rgba(25,78,48,.16); }
    .profile-photo::before { content:''; position:absolute; top:17%; left:34%; width:32%; height:32%; border-radius:50%; background:#f0c19e; box-shadow:0 -3px 0 3px rgba(44,57,43,.35); }
    .profile-photo::after { content:''; position:absolute; right:12%; bottom:-13%; left:12%; height:55%; border-radius:55% 55% 0 0; background:#1e4935; box-shadow:inset 0 7px 0 rgba(255,255,255,.13); }
    .profile-photo.small { width:32px; height:32px; border-radius:10px; }
    .profile-photo.menu { width:29px; height:29px; border-radius:9px; }
    .profile-photo.large { width:82px; height:82px; border-radius:25px; }
    .number-copy { display:grid; gap:2px; min-width:0; flex:1; }
    .number-copy strong { overflow:hidden; font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
    .number-copy small { overflow:hidden; color:var(--muted); font-size:10px; text-overflow:ellipsis; white-space:nowrap; }
    .status-dot { width:7px; height:7px; border-radius:50%; background:var(--green); }
    .status-dot.qr { background:#dc991b; }
    .status-dot.expired,.status-dot.error { background:#ca5b50; }
    .status-dot.offline { background:#6b87b4; }
    .chevron { color:var(--muted); font-size:12px; }
    .topnav { display:none; align-items:center; gap:21px; color:var(--muted); font-size:12px; }
    .topnav .active { color:var(--ink); font-weight:800; }
    .account { display:flex; align-items:center; gap:9px; font-size:12px; font-weight:750; }
    .avatar { display:grid; place-items:center; width:31px; height:31px; border-radius:50%; color:#fff; background:#cf7554; font-size:11px; }
    .number-menu { position:absolute; z-index:25; top:61px; left:50%; width:320px; padding:9px; transform:translateX(-50%); border:1px solid var(--line); border-radius:15px; background:#fff; box-shadow:0 22px 45px rgba(24,48,36,.16); }
    .menu-caption { padding:7px 9px 8px; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; }
    .number-item { display:flex; align-items:center; gap:10px; width:100%; padding:10px 9px; border:1px solid transparent; border-radius:11px; color:var(--ink); background:#fff; text-align:left; }
    .number-item:hover,.number-item.active { border-color:#cce5d3; background:#f2faf4; }
    .number-item .number-avatar { width:29px; height:29px; border-radius:9px; }
    .number-item-copy { display:grid; gap:3px; min-width:0; flex:1; }
    .number-item-copy strong { font-size:12px; }
    .number-item-copy small { color:var(--muted); font-size:10px; }
    .item-right { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:10px; white-space:nowrap; }
    .default-tag { padding:3px 6px; border-radius:6px; color:#76552a; background:#fff1c9; font-size:9px; font-weight:800; }
    .menu-rule { height:1px; margin:8px 0; background:var(--line); }
    .menu-action { display:flex; align-items:center; gap:7px; width:100%; padding:9px; border:0; border-radius:9px; color:var(--green); background:transparent; font-size:12px; font-weight:800; text-align:left; }
    .menu-action:hover { background:var(--green-soft); }
    .menu-action.secondary { color:var(--muted); font-size:11px; font-weight:650; }
    .page { width:min(1120px,calc(100% - 40px)); margin:0 auto; padding:53px 0 140px; }
    .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:33px; }
    .eyebrow { margin:0 0 9px; color:var(--green); font-size:10px; font-weight:850; letter-spacing:.13em; text-transform:uppercase; }
    h1,h2,h3,p { margin-top:0; }
    h1 { margin-bottom:9px; font-size:clamp(31px,4vw,48px); line-height:1.02; letter-spacing:-.06em; }
    h2 { margin-bottom:8px; font-size:24px; line-height:1.1; letter-spacing:-.04em; }
    h3 { margin-bottom:5px; font-size:14px; }
    .lede { max-width:590px; margin-bottom:0; color:var(--muted); font-size:15px; line-height:1.55; }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:42px; padding:0 16px; border:1px solid transparent; border-radius:11px; color:#fff; background:var(--green); font-size:12px; font-weight:800; transition:transform .15s,box-shadow .15s; }
    .button:hover { transform:translateY(-1px); box-shadow:0 10px 21px rgba(8,116,67,.18); }
    .button.secondary { border-color:var(--line); color:var(--ink); background:#fff; box-shadow:none; }
    .button.ghost { border-color:transparent; color:var(--green); background:transparent; box-shadow:none; }
    .button.small { min-height:34px; padding:0 11px; border-radius:9px; font-size:11px; }
    .button:disabled { cursor:default; opacity:.6; transform:none; box-shadow:none; }
    .card { border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:var(--shadow); }
    .chip { display:inline-flex; align-items:center; gap:6px; min-height:25px; padding:0 9px; border-radius:99px; font-size:10px; font-weight:850; white-space:nowrap; }
    .chip::before { content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
    .chip.connected { color:var(--green); background:var(--green-soft); }
    .chip.qr { color:var(--amber); background:var(--amber-soft); }
    .chip.expired,.chip.error { color:var(--red); background:var(--red-soft); }
    .chip.offline { color:var(--blue); background:var(--blue-soft); }
    .chip.default { color:#76552a; background:#fff1c9; }
    .chip.default::before { content:'★'; width:auto; height:auto; background:none; }
    .tiny { color:var(--muted); font-size:11px; }
    .hero { display:grid; grid-template-columns:1.15fr .85fr; min-height:275px; overflow:hidden; }
    .hero-copy { display:flex; flex-direction:column; justify-content:center; padding:38px 43px; }
    .hero-copy h2 { margin-bottom:5px; font-size:32px; }
    .hero-copy p { max-width:460px; color:var(--muted); line-height:1.55; }
    .profile-header { display:flex; align-items:center; gap:18px; }
    .profile-header .eyebrow { margin-bottom:7px; }
    .profile-number { color:var(--muted); font-size:14px; }
    .hero-status-line { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
    .hero-copy-note { margin:20px 0 0; font-size:12px; }
    .hero-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
    .hero-status { display:flex; flex-direction:column; justify-content:center; gap:13px; padding:31px 35px; background:#ecf7ef; }
    .health-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .health-top .eyebrow { margin:0; }
    .health-percent { color:var(--green); font-size:11px; font-weight:850; }
    .health-orb { display:flex; align-items:center; gap:12px; color:var(--green); font-size:13px; font-weight:850; }
    .health-orb i { width:17px; height:17px; border:4px solid #c2e8cf; border-radius:50%; background:var(--green); }
    .health-note { max-width:260px; color:#587364; font-size:12px; line-height:1.45; }
    .hero-facts { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
    .hero-fact { min-width:0; padding:9px; border:1px solid #d2ebd9; border-radius:10px; color:#4c6d59; background:rgba(255,255,255,.54); font-size:10px; line-height:1.35; }
    .hero-fact strong { display:block; margin-top:3px; color:var(--green); font-size:10px; }
    .hero-id { margin:0; color:#829c8b; font-family:ui-monospace,monospace; font-size:9px; }
    .dashboard-layout { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(290px,.75fr); gap:18px; align-items:stretch; }
    .dashboard-main { min-width:0; }
    .activity-sidebar { min-width:0; }
    .activity-sidebar .panel { height:100%; }
    .dashboard-grid { display:grid; grid-template-columns:1fr 1fr; gap:17px; margin-top:17px; }
    .panel { padding:23px; border:1px solid var(--line); border-radius:16px; background:#fff; }
    .panel-head { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:19px; }
    .panel-head h3 { margin-bottom:0; font-size:14px; }
    .activity { display:grid; gap:15px; }
    .activity-row { display:grid; grid-template-columns:27px 1fr auto; align-items:center; gap:10px; }
    .activity-icon { display:grid; place-items:center; width:27px; height:27px; border-radius:9px; color:var(--green); background:var(--green-soft); font-size:11px; font-weight:850; }
    .activity-row strong { display:block; margin-bottom:2px; font-size:11px; }
    .activity-row small { color:var(--muted); font-size:10px; }
    .activity-time { color:#9aa79f; font-size:10px; }
    .quick-list { display:grid; gap:8px; }
    .quick { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border:0; border-bottom:1px solid #eef2ef; color:var(--ink); background:transparent; font-size:11px; text-align:left; }
    .quick:last-child { border-bottom:0; }
    .quick span { color:var(--muted); }
    .quick b { color:var(--green); font-size:11px; }
    .health-card { position:relative; overflow:hidden; padding:23px; background:linear-gradient(140deg,#ffffff 0%,#f1faf3 100%); }
    .health-card::after { content:''; position:absolute; right:-38px; bottom:-55px; width:170px; height:170px; border:1px solid #d8efde; border-radius:50%; box-shadow:0 0 0 18px rgba(216,239,222,.35),0 0 0 37px rgba(216,239,222,.2); pointer-events:none; }
    .health-card .panel-head { position:relative; z-index:1; align-items:flex-start; margin-bottom:17px; }
    .health-card .panel-head h3 { margin-top:2px; font-size:17px; }
    .health-card .eyebrow { margin-bottom:4px; font-size:9px; }
    .health-main { position:relative; z-index:1; display:flex; align-items:center; gap:14px; }
    .health-ring { display:grid; place-items:center; flex:0 0 auto; width:65px; height:65px; border:7px solid #c8ecd2; border-radius:50%; color:var(--green); background:#fff; box-shadow:0 0 0 7px rgba(225,246,231,.85); font-size:23px; font-weight:850; }
    .health-copy strong { display:block; margin-bottom:4px; color:var(--green); font-size:14px; }
    .health-copy p { max-width:205px; margin:0; color:var(--muted); font-size:10px; line-height:1.45; }
    .health-track { position:relative; z-index:1; height:7px; margin-top:21px; overflow:hidden; border-radius:99px; background:#dcefe1; }
    .health-track span { display:block; width:100%; height:100%; border-radius:inherit; background:linear-gradient(90deg,#58bd76,var(--green)); }
    .health-meta { position:relative; z-index:1; display:flex; justify-content:space-between; gap:10px; margin-top:7px; color:var(--muted); font-size:9px; }
    .health-facts { position:relative; z-index:1; display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:18px; }
    .health-fact { min-width:0; padding:10px; border:1px solid #d9eade; border-radius:10px; background:rgba(255,255,255,.72); }
    .health-fact small { display:block; overflow:hidden; margin-bottom:5px; color:var(--muted); font-size:9px; text-overflow:ellipsis; white-space:nowrap; }
    .health-fact b { display:block; overflow:hidden; color:var(--ink); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    .health-id { position:relative; z-index:1; margin:14px 0 0; color:#91a198; font-family:ui-monospace,monospace; font-size:9px; }
    .onboarding { max-width:890px; margin:0 auto; }
    .onboarding-head { text-align:center; }
    .onboarding-head h1 { margin-bottom:12px; font-size:clamp(30px,4vw,46px); }
    .onboarding-head .lede { margin:0 auto; }
    .steps { display:flex; align-items:center; max-width:560px; margin:30px auto 27px; }
    .step { display:flex; align-items:center; gap:8px; color:#a4afa8; font-size:10px; font-weight:800; white-space:nowrap; }
    .step-num { display:grid; place-items:center; width:26px; height:26px; border:1px solid #cdd9d1; border-radius:50%; background:#fff; font-size:10px; }
    .step.active { color:var(--green); }
    .step.active .step-num { border-color:var(--green); color:#fff; background:var(--green); }
    .step.done { color:var(--ink); }
    .step.done .step-num { color:var(--green); border-color:#bde3c8; background:var(--green-soft); }
    .step-line { flex:1; height:1px; margin:0 10px; background:#d9e2dc; }
    .onboarding-card { display:grid; grid-template-columns:.9fr 1.1fr; overflow:hidden; }
    .form-side { padding:38px; }
    .form-side h2 { font-size:25px; }
    .form-side > p { max-width:350px; color:var(--muted); font-size:13px; line-height:1.55; }
    .field { display:grid; gap:6px; margin-top:21px; }
    .field label { color:var(--muted); font-size:10px; font-weight:850; letter-spacing:.05em; text-transform:uppercase; }
    .field input { width:100%; height:42px; padding:0 11px; border:1px solid #cbd9d0; border-radius:10px; color:var(--ink); background:#fff; font-size:12px; }
    .form-actions { display:flex; gap:8px; margin-top:22px; }
    .onboarding-aside { display:grid; place-items:center; min-height:360px; padding:35px; background:#edf7ef; }
    .aside-copy { max-width:310px; text-align:center; }
    .aside-copy h3 { margin-top:17px; font-size:16px; }
    .aside-copy p { color:#5b7665; font-size:11px; line-height:1.5; }
    .qr-box { display:grid; place-items:center; width:min(265px,100%); padding:20px; border-radius:20px; background:#fff; box-shadow:0 19px 37px rgba(26,92,51,.13); }
    .qr-grid { display:grid; grid-template-columns:repeat(21,1fr); gap:2px; width:100%; max-width:222px; aspect-ratio:1; padding:8px; border-radius:5px; background:#fff; }
    .qr-grid span { display:block; border-radius:1px; background:#fff; }
    .qr-grid span.on { background:#13231d; }
    .qr-note { margin:12px 0 0; color:var(--muted); font-size:10px; text-align:center; }
    .onboarding-qr { display:grid; grid-template-columns:1fr 1fr; gap:28px; padding:31px; }
    .onboarding-qr .qr-box { justify-self:center; width:min(315px,100%); }
    .instruction-list { display:grid; gap:15px; align-content:center; }
    .instruction-list h3 { margin-bottom:2px; font-size:17px; }
    .instruction { display:grid; grid-template-columns:26px 1fr; gap:9px; align-items:start; color:var(--muted); font-size:11px; line-height:1.48; }
    .instruction b { display:grid; place-items:center; width:25px; height:25px; border-radius:8px; color:var(--green); background:var(--green-soft); font-size:10px; }
    .instruction-list .button { width:100%; margin-top:5px; }
    .success-card { max-width:620px; margin:0 auto; padding:48px 35px; text-align:center; }
    .success-mark { display:grid; place-items:center; width:64px; height:64px; margin:0 auto 21px; border-radius:21px; color:var(--green); background:var(--green-soft); font-size:29px; font-weight:850; }
    .success-card p { max-width:430px; margin:0 auto 22px; color:var(--muted); font-size:13px; line-height:1.55; }
    .success-card .button { margin:0 4px; }
    .variant-b { color:#eff8f1; background:#13241f; }
    .variant-b .topbar { color:#e9f3ec; border-color:#2d463c; background:#162a22; }
    .variant-b .brand { color:#eef7f0; }
    .variant-b .topnav { color:#8fa89b; }
    .variant-b .topnav .active { color:#eef7f0; }
    .variant-b .number-trigger { color:#eaf4ed; }
    .variant-b .number-trigger:hover,.variant-b .number-trigger[aria-expanded="true"] { border-color:#38584a; background:#203a2e; }
    .variant-b .number-copy small,.variant-b .chevron { color:#95aea0; }
    .variant-b .page { padding-top:45px; }
    .variant-b .eyebrow { color:#86d8a4; }
    .variant-b h1 { color:#f4fbf6; }
    .variant-b .lede { color:#a4b8ad; }
    .variant-b .hero { border-color:#315044; background:#193229; box-shadow:0 25px 60px rgba(0,0,0,.2); }
    .variant-b .hero-copy p,.variant-b .tiny { color:#98b1a3; }
    .variant-b .hero-status { color:#e8f6ec; background:#204435; }
    .variant-b .health-note { color:#a4c3ae; }
    .variant-b .metric,.variant-b .panel { border-color:#d8e3db; color:var(--ink); }
    .variant-b .button.secondary { color:#eef6ef; border-color:#486656; background:#244637; }
    .variant-c .page-head { align-items:flex-start; }
    .variant-c .hero { grid-template-columns:1fr; max-width:820px; margin:0 auto; }
    .variant-c .hero-copy { padding:50px 55px 26px; text-align:center; }
    .variant-c .hero-copy p { margin-right:auto; margin-left:auto; }
    .variant-c .hero-actions { justify-content:center; }
    .variant-c .hero-status { flex-direction:row; align-items:center; justify-content:center; min-height:118px; padding:22px; }
    .prototype-bar { position:fixed; z-index:80; bottom:17px; left:50%; display:flex; align-items:center; gap:10px; transform:translateX(-50%); padding:8px 10px; border:1px solid #3b5a4c; border-radius:99px; color:#edf8f0; background:#173128; box-shadow:0 15px 32px rgba(12,33,22,.25); }
    .prototype-bar button { display:grid; place-items:center; width:28px; height:28px; border:0; border-radius:50%; color:#d8f2df; background:#2a5742; font-size:15px; }
    .prototype-bar button:hover { background:#3d7959; }
    .prototype-label { min-width:156px; color:#f4fbf5; font-size:10px; font-weight:800; text-align:center; }
    .prototype-label small { display:block; margin-top:2px; color:#a5c0ae; font-size:9px; font-weight:500; }
    .scenario { position:fixed; z-index:79; right:17px; bottom:17px; display:flex; align-items:center; gap:5px; padding:5px; border:1px solid #d0ddd3; border-radius:11px; background:#fff; box-shadow:0 10px 24px rgba(21,48,33,.11); }
    .scenario button { min-height:27px; padding:0 8px; border:0; border-radius:7px; color:var(--muted); background:transparent; font-size:9px; font-weight:800; }
    .scenario button:hover { color:var(--green); background:var(--green-soft); }
    .toast { position:fixed; z-index:90; right:20px; bottom:75px; max-width:320px; padding:12px 14px; border:1px solid #a8d7b8; border-radius:11px; color:#164a2f; background:#eefaf2; box-shadow:0 14px 28px rgba(20,55,35,.16); font-size:11px; font-weight:750; }
    @media (max-width:860px) { .topbar-center { position:static; flex:1; transform:none; } .number-trigger { min-width:0; margin:auto; } .topnav { display:none; } .hero { grid-template-columns:1fr; } .hero-status { min-height:150px; } .dashboard-layout { grid-template-columns:1fr; } .activity-sidebar { order:2; } .dashboard-grid { grid-template-columns:1fr; } .onboarding-card,.onboarding-qr { grid-template-columns:1fr; } .onboarding-aside { min-height:250px; } .onboarding-qr .qr-box { order:0; } .instruction-list { order:1; } .scenario { display:none; } }
    @media (max-width:600px) { .prototype-ribbon { font-size:8px; } .topbar { height:65px; padding:0 15px; } .brand span:last-child,.account span { display:none; } .number-trigger { padding:5px; } .number-copy small { max-width:115px; } .page { width:calc(100% - 28px); padding-top:34px; } .page-head { display:block; } .page-head .button { margin-top:18px; } .hero-copy { padding:30px 24px; } .hero-copy h2 { font-size:27px; } .hero-status { padding:28px 24px; } .metric-row { grid-template-columns:1fr; } .panel { padding:19px; } .form-side { padding:28px 23px; } .onboarding-aside { min-height:225px; padding:25px; } .onboarding-qr { padding:22px; } .prototype-bar { bottom:11px; } .prototype-label { min-width:127px; } .number-menu { top:54px; left:auto; right:13px; width:min(310px,calc(100vw - 26px)); transform:none; } }
  </style>
</head>
<body>
  <div class="prototype-ribbon"><strong>Protótipo descartável</strong><span>dados locais · nenhuma alteração real é enviada</span></div>
  <div id="app"></div>
  <div class="prototype-bar" id="prototype-bar"><button type="button" data-switch="prev" aria-label="Variação anterior">←</button><div class="prototype-label" id="prototype-label"></div><button type="button" data-switch="next" aria-label="Próxima variação">→</button></div>
  <div class="scenario" id="scenario"><button data-scenario="single">1 conexão</button><button data-scenario="first">Primeiro acesso</button><button data-scenario="demo">3 conexões</button></div>
  <script>
    /* Pergunta desta exploração: o painel deve sempre estar focado em um único número? */
    const variants={a:{label:'A',name:'Dashboard essencial'},b:{label:'B',name:'Dashboard compacto'},c:{label:'C',name:'Foco no onboarding'}};
    const statusInfo=(status)=>({connected:{label:'Conectada',className:'connected',note:'Pronta para uso'},qr:{label:'Aguardando leitura',className:'qr',note:'Leia o QR pelo WhatsApp'},expired:{label:'QR expirado',className:'expired',note:'Gere um novo QR para continuar'},offline:{label:'Desconectada',className:'offline',note:'Conecte novamente pelo QR'},error:{label:'Não foi possível verificar',className:'error',note:'Tente atualizar o estado'}}[status]||{label:'Aguardando ação',className:'qr',note:'Continue a configuração'});
    const state={connections:[{id:'primary',name:'WhatsApp pessoal',phone:'+55 31 98888-1200',status:'connected',qrVersion:2}],activeId:'primary',defaultId:'primary',menuOpen:false,onboardingOpen:false,onboardingStep:3,draft:null,toast:'',demo:false,firstRun:false};
    const urlParams=new URLSearchParams(location.search);let variant=(urlParams.get('variant')||'a').toLowerCase();if(!variants[variant])variant='a';let toastTimer;
    const esc=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const initials=(name)=>String(name||'WA').split(/\s+/).slice(0,2).map((part)=>part[0]).join('').toUpperCase();
    const active=()=>state.connections.find((connection)=>connection.id===state.activeId)||null;
    const isOnboarding=()=>state.onboardingOpen||state.connections.length===0||state.firstRun;
    function fakeQr(seed){const cells=[];for(let y=0;y<21;y++)for(let x=0;x<21;x++){let on=false;const finder=(ox,oy)=>{if(x<ox||x>=ox+7||y<oy||y>=oy+7)return false;const px=x-ox,py=y-oy;return px===0||px===6||py===0||py===6||(px>=2&&px<=4&&py>=2&&py<=4);};if(finder(0,0)||finder(14,0)||finder(0,14))on=true;else on=((x*17+y*31+seed*13+x*y)%7)<3;cells.push('<span class="'+(on?'on':'')+'"></span>');}return '<div class="qr-grid" aria-label="QR code de demonstração">'+cells.join('')+'</div>';}
    function profilePhoto(name,size){return '<span class="profile-photo '+size+'" role="img" aria-label="Foto de perfil de '+esc(name)+'"></span>';}
    function topbar(){const connection=active();const info=connection?statusInfo(connection.status):{className:'qr',label:'Configurar'};return '<header class="topbar"><a class="brand" href="?variant='+variant+'"><span class="brand-mark">⌁</span><span>Pulse workspace</span></a><div class="topbar-center"><button class="number-trigger" data-action="toggle-menu" aria-expanded="'+state.menuOpen+'" aria-haspopup="listbox">'+(connection?profilePhoto(connection.name,'small'):'<span class="number-avatar">＋</span>')+'<span class="number-copy"><strong>'+(connection?esc(connection.name):'Configurar WhatsApp')+'</strong><small>'+(connection?esc(connection.phone||'Número não identificado'):'Comece pelo seu primeiro número')+'</small></span><span class="status-dot '+info.className+'"></span><span class="chevron">⌄</span></button>'+(state.menuOpen?numberMenu():'')+'</div><nav class="topnav"><span class="active">Dashboard</span><span>Atividade</span></nav><div class="account"><span>Lucca M.</span><span class="avatar">LM</span></div></header>';}
    function numberMenu(){return '<div class="number-menu" role="listbox"><div class="menu-caption">Trocar contexto</div>'+(state.connections.length?state.connections.map((connection)=>{const info=statusInfo(connection.status);return '<div class="number-item '+(connection.id===state.activeId?'active':'')+'" data-action="select" data-id="'+esc(connection.id)+'">'+profilePhoto(connection.name,'menu')+'<span class="number-item-copy"><strong>'+esc(connection.name)+'</strong><small>'+esc(connection.phone||'Número não identificado')+' · '+info.label+'</small></span><span class="item-right">'+(connection.id===state.activeId?'Ativo':'')+(connection.id===state.defaultId?'<span class="default-tag">Padrão</span>':'<span class="menu-action secondary" data-action="default" data-id="'+esc(connection.id)+'">Tornar padrão</span>')+'</span></div>';}).join(''):'<p class="tiny" style="padding:8px 9px">Nenhuma conexão cadastrada.</p>')+'<div class="menu-rule"></div><button class="menu-action" data-action="onboarding">＋ Adicionar outro número</button><button class="menu-action secondary" data-action="first-run">Como funciona o onboarding?</button></div>';}
    function pageHead(title,description,action){return '<div class="page-head"><div><p class="eyebrow">Visão geral</p><h1>'+title+'</h1>'+(description?'<p class="lede">'+description+'</p>':'')+'</div>'+(action||'')+'</div>';}
    function steps(step){const labels=['Criar instância','Ler QR code','Conectado'];return '<div class="steps" aria-label="Progresso da conexão">'+labels.map((label,index)=>'<div class="step '+(index+1<step?'done':index+1===step?'active':'')+'"><span class="step-num">'+(index+1<step?'✓':index+1)+'</span><span>'+label+'</span></div>'+(index<2?'<span class="step-line"></span>':'')).join('')+'</div>';}
    function activityPanel(){return '<section class="panel"><div class="panel-head"><h3>Atividade recente</h3><button class="button ghost small">Ver tudo</button></div><div class="activity"><div class="activity-row"><span class="activity-icon">✓</span><span><strong>Conexão verificada</strong><small>O número está pronto para uso</small></span><span class="activity-time">agora</span></div><div class="activity-row"><span class="activity-icon">↗</span><span><strong>Webhook ativo</strong><small>Eventos serão capturados a partir de agora</small></span><span class="activity-time">hoje</span></div><div class="activity-row"><span class="activity-icon">⌁</span><span><strong>Instância criada</strong><small>Primeiro acesso concluído</small></span><span class="activity-time">hoje</span></div></div></section>';}
    function connectedHero(connection){return '<section class="card hero"><div class="hero-copy"><div class="profile-header">'+profilePhoto(connection.name,'large')+'<div><p class="eyebrow">'+(connection.id===state.defaultId?'Conexão padrão':'Conexão ativa')+'</p><h2>'+esc(connection.name)+'</h2><div class="profile-number">'+esc(connection.phone||'Número ainda não identificado')+'</div><div class="hero-status-line"><span class="chip connected">Conectada</span>'+(connection.id===state.defaultId?'<span class="chip default">Padrão</span>':'')+'</div></div></div><p class="hero-copy-note">Este número está conectado e pronto para as ações do seu workspace.</p><div class="hero-actions"><button class="button" data-action="manage">Gerenciar conexão</button></div></div><div class="hero-status"><div class="health-top"><p class="eyebrow">Saúde da conexão</p></div><div class="health-orb"><i></i>Conectada agora</div><div class="health-track" aria-label="Saúde da conexão: 100%"><span></span></div><div class="health-meta"><span>Conexão estável</span><span>verificada agora</span></div><p class="hero-id">ID · '+esc(connection.id)+'</p></div></section>';}
    function dashboardA(){const connection=active();return topbar()+'<main class="page">'+pageHead('Tudo certo por aqui','','')+'<div class="dashboard-layout"><div class="dashboard-main">'+connectedHero(connection)+'</div><aside class="activity-sidebar">'+activityPanel()+'</aside></div></main></div>';}
    function dashboardB(){const connection=active();return topbar()+'<main class="page">'+pageHead('Visão rápida','Um painel compacto para acompanhar o número atual sem transformar a troca de contexto em uma página própria.','<button class="button secondary" data-action="manage">Abrir detalhes</button>')+'<section class="card hero"><div class="hero-copy"><p class="eyebrow">Agora ativo</p><h2>'+esc(connection.name)+'</h2><p>'+esc(connection.phone||'Número não identificado')+' · pronto para receber eventos.</p><div class="hero-actions"><span class="chip connected">Conectada</span>'+(connection.id===state.defaultId?'<span class="chip default">Padrão</span>':'<button class="button ghost small" data-action="default" data-id="'+esc(connection.id)+'">☆ Tornar padrão</button>')+'</div></div><div class="hero-status"><div class="health-orb"><i></i>Saúde normal</div><div class="health-note">Verificado há poucos segundos. Nenhuma ação necessária.</div></div></section><div class="dashboard-grid"><section class="panel"><div class="panel-head"><h3>Próximas ações</h3></div><div class="quick-list"><button class="quick" data-action="onboarding"><span>Adicionar mais um número</span><b>＋</b></button><button class="quick" data-action="manage"><span>Revisar detalhes da conexão</span><b>→</b></button><button class="quick" data-action="first-run"><span>Rever como funciona</span><b>?</b></button></div></section>'+activityPanel()+'</div></main></div>';}
    function dashboardC(){const connection=active();return topbar()+'<main class="page">'+pageHead('Seu número principal','O acesso começa e termina no número padrão. Outros números continuam disponíveis pelo seletor discreto acima.','')+'<section class="card hero"><div class="hero-copy"><p class="eyebrow">Padrão atual</p><h2>'+esc(connection.name)+'</h2><p>'+esc(connection.phone||'Número não identificado')+' · esta é a conexão em foco nesta sessão.</p><div class="hero-actions"><button class="button" data-action="manage">Ver estado completo</button><button class="button ghost small" data-action="onboarding">Adicionar número</button></div></div><div class="hero-status"><div class="health-orb"><i></i>Conectada</div><div class="health-note">Se você trocar de contexto pelo topo, esta área muda sem abrir uma central de números.</div></div></section><div class="metric-row"><div class="metric"><span class="metric-label">Contexto</span><strong>Um número por vez</strong></div><div class="metric"><span class="metric-label">Padrão</span><strong>Definido explicitamente</strong></div><div class="metric"><span class="metric-label">Troca</span><strong>Seletor no topo</strong></div></div></main></div>';}
    function connectionForm(){return '<div class="onboarding-card card"><form class="form-side" id="connection-form"><p class="eyebrow">'+(state.connections.length?'Adicionar número':'Primeira conexão')+'</p><h2>'+(state.connections.length?'Configure este novo número':'Vamos conectar seu WhatsApp')+'</h2><p>Este processo cuida de uma conexão por vez. Dê um nome para reconhecer o número e, em seguida, leia o QR code pelo aplicativo.</p><div class="field"><label for="connection-name">Nome da conexão</label><input id="connection-name" name="name" required value="'+(state.connections.length?'':'WhatsApp pessoal')+'" placeholder="Ex.: WhatsApp atendimento"></div><div class="field"><label for="connection-phone">Número (opcional)</label><input id="connection-phone" name="phone" inputmode="tel" placeholder="Ex.: +55 31 99999-0000"></div><div class="form-actions"><button type="submit" class="button">Criar e mostrar QR</button>'+(state.connections.length?'<button type="button" class="button secondary" data-action="cancel-onboarding">Cancelar</button>':'')+'</div></form><div class="onboarding-aside"><div class="aside-copy"><div class="qr-box">'+fakeQr(1)+'<p class="qr-note">O QR aparece no próximo passo.</p></div><h3>Uma conexão de cada vez</h3><p>Depois de conectar, você volta direto para o dashboard deste número.</p></div></div></div>';}
    function qrOnboarding(connection){const info=statusInfo(connection.status);return '<div class="onboarding-qr card"><div class="qr-box">'+fakeQr(connection.qrVersion||1)+'<p class="qr-note">QR de demonstração · versão '+connection.qrVersion+'</p></div><div class="instruction-list"><p class="eyebrow">Passo 2 de 3</p><h3>'+(connection.status==='expired'?'Este QR code expirou':'Leia este QR pelo WhatsApp')+'</h3><p class="tiny">Abra <strong>Configurações → Aparelhos conectados</strong> no WhatsApp e aponte a câmera para o código.</p><div class="instruction"><b>1</b><span>Abra o WhatsApp no seu celular.</span></div><div class="instruction"><b>2</b><span>Toque em <strong>Conectar aparelho</strong>.</span></div><div class="instruction"><b>3</b><span>Mantenha esta tela aberta até a conexão ser confirmada.</span></div><button class="button" data-action="simulate-connected" data-id="'+esc(connection.id)+'">Simular QR lido</button><button class="button secondary" data-action="renew" data-id="'+esc(connection.id)+'">↻ '+(connection.status==='expired'?'Gerar novo QR code':'Pedir novo QR code')+'</button><span class="tiny">'+info.note+'</span></div></div>';}
    function successOnboarding(connection){return '<div class="success-card card"><div class="success-mark">✓</div><p class="eyebrow">Passo 3 de 3</p><h2>WhatsApp conectado</h2><p><strong>'+esc(connection.name)+'</strong> está pronto. A primeira conexão criada vira padrão automaticamente; novos números só viram padrão quando você escolher essa ação.</p><button class="button" data-action="finish-onboarding">Ir para o dashboard</button></div>';}
    function onboardingPage(){const connection=active()||state.draft;const step=state.connections.length===0?1:state.onboardingStep;return topbar()+'<main class="page"><section class="onboarding"><div class="onboarding-head"><p class="eyebrow">Onboarding focado</p><h1>'+(step===1?(state.connections.length?'Adicionar um novo número':'Conecte seu WhatsApp'):step===2?'Agora, leia o QR code':'Conexão concluída')+'</h1><p class="lede">'+(step===1?'Você vai configurar somente esta conexão. Os demais números ficam fora do caminho até que você precise deles.':step===2?'O QR é exclusivo desta conexão. Se ele expirar, peça outro sem criar uma segunda instância.':'Seu dashboard será sobre este número até você trocar o contexto no seletor superior.')+'</p></div>'+steps(step)+(step===1?connectionForm():step===2?qrOnboarding(connection):successOnboarding(connection))+'</section></main></div>';}
    function render(){const onboarding=isOnboarding();document.body.classList.toggle('variant-b',variant==='b'&&!onboarding);const body=onboarding?onboardingPage():(variant==='a'?dashboardA():variant==='b'?dashboardB():dashboardC());document.getElementById('app').innerHTML=body;document.getElementById('prototype-label').innerHTML=variants[variant].label+' · '+variants[variant].name+'<small>← → para alternar</small>';if(state.toast){const toast=document.createElement('div');toast.className='toast';toast.textContent=state.toast;document.body.appendChild(toast);setTimeout(()=>toast.remove(),2600);state.toast='';}if(onboarding)setTimeout(()=>document.querySelector('#connection-name')?.focus(),0);}
    function notify(message){state.toast=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render();},2600);render();}
    function updateUrl(){const next=new URL(location.href);next.searchParams.set('variant',variant);history.replaceState({},'',next);}
    function startOnboarding(){state.menuOpen=false;state.onboardingOpen=true;state.onboardingStep=1;state.draft=null;render();}
    function createConnection(name,phone){const id='connection-'+Date.now();const connection={id,name:name||'Nova conexão',phone:phone||'',status:'qr',qrVersion:1};state.connections.push(connection);state.activeId=id;if(!state.defaultId)state.defaultId=id;state.draft=connection;state.onboardingOpen=true;state.onboardingStep=2;state.firstRun=false;state.menuOpen=false;state.demo=false;notify(state.connections.length===1?'Conexão criada e definida como padrão.':'Conexão criada. Leia o QR para continuar.');}
    function loadSingle(){state.connections=[{id:'primary',name:'WhatsApp pessoal',phone:'+55 31 98888-1200',status:'connected',qrVersion:2}];state.defaultId='primary';state.activeId='primary';state.onboardingOpen=false;state.onboardingStep=3;state.firstRun=false;state.demo=false;state.menuOpen=false;notify('Cenário de uma conexão carregado.');}
    function loadFirst(){state.connections=[];state.defaultId=null;state.activeId=null;state.onboardingOpen=true;state.onboardingStep=1;state.firstRun=true;state.demo=false;state.menuOpen=false;notify('Primeiro acesso carregado.');}
    function loadDemo(){state.connections=[{id:'primary',name:'WhatsApp pessoal',phone:'+55 31 98888-1200',status:'connected',qrVersion:2},{id:'support',name:'Atendimento',phone:'+55 31 97777-4100',status:'qr',qrVersion:4},{id:'old',name:'Número antigo',phone:'+55 31 96666-8833',status:'expired',qrVersion:1}];state.defaultId='primary';state.activeId='primary';state.onboardingOpen=false;state.onboardingStep=3;state.firstRun=false;state.demo=true;state.menuOpen=false;notify('Cenário com três conexões carregado. O dashboard continua mostrando uma por vez.');}
    function setActive(id){const connection=state.connections.find((item)=>item.id===id);if(!connection)return;state.activeId=id;state.menuOpen=false;state.onboardingOpen=connection.status!=='connected';state.onboardingStep=connection.status==='connected'?3:2;state.draft=connection;notify('Contexto trocado para '+connection.name+'.');}
    function setDefault(id){state.defaultId=id;state.activeId=id;state.menuOpen=false;notify('Conexão padrão atualizada.');}
    function handle(action,id){const connection=state.connections.find((item)=>item.id===id);if(action==='toggle-menu'){state.menuOpen=!state.menuOpen;render();return;}if(action==='onboarding'){startOnboarding();return;}if(action==='first-run'){loadFirst();return;}if(action==='cancel-onboarding'){state.onboardingOpen=false;state.onboardingStep=3;state.draft=null;render();return;}if(action==='select'){setActive(id);return;}if(action==='default'&&connection){setDefault(id);return;}if(action==='manage'&&connection){if(connection.status==='connected'){notify('Esta conexão está conectada e pronta para uso.');}else{state.onboardingOpen=true;state.onboardingStep=2;state.draft=connection;render();}return;}if(action==='renew'&&connection){connection.qrVersion=(connection.qrVersion||1)+1;connection.status='qr';state.activeId=id;state.draft=connection;state.onboardingOpen=true;state.onboardingStep=2;notify('Novo QR code gerado para a mesma conexão.');return;}if(action==='simulate-connected'&&connection){connection.status='connected';state.activeId=id;state.draft=connection;state.onboardingOpen=true;state.onboardingStep=3;notify('Conexão simulada como concluída.');return;}if(action==='finish-onboarding'){state.onboardingOpen=false;state.onboardingStep=3;state.draft=null;notify('Você voltou ao dashboard da conexão.');return;}}
    document.addEventListener('click',(event)=>{const target=event.target.closest('[data-action],[data-switch],[data-scenario]');if(!target)return;if(target.dataset.switch){const keys=Object.keys(variants),index=keys.indexOf(variant);variant=keys[(index+(target.dataset.switch==='next'?1:keys.length-1))%keys.length];updateUrl();render();return;}if(target.dataset.scenario){if(target.dataset.scenario==='single')loadSingle();if(target.dataset.scenario==='first')loadFirst();if(target.dataset.scenario==='demo')loadDemo();return;}handle(target.dataset.action,target.dataset.id);});
    document.addEventListener('submit',(event)=>{if(event.target.id!=='connection-form')return;event.preventDefault();const data=new FormData(event.target);createConnection(data.get('name'),data.get('phone'));});
    document.addEventListener('keydown',(event)=>{if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight')return;if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;const keys=Object.keys(variants),index=keys.indexOf(variant);variant=keys[(index+(event.key==='ArrowRight'?1:keys.length-1))%keys.length];updateUrl();render();});
    document.addEventListener('click',(event)=>{if(!event.target.closest('.number-menu,.number-trigger')){if(state.menuOpen){state.menuOpen=false;render();}}});
    render();
  </script>
</body>
</html>
